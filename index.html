<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Directorio de Proyectos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="page-header">
      <a class="brand-logo" href="https://folderlinks.zerotoplan.com/" target="_blank" rel="noopener">
        <img src="FolderLinks.png" alt="FolderLinks" />
      </a>
      <h1>Directorio de Proyectos</h1>

      <!-- 🔄 Switch de entorno -->
      <div class="env-switch">
        <label class="switch">
          <input type="checkbox" id="envToggle" />
          <span class="slider"></span>
        </label>
        <span id="envLabel">Producción</span>
      </div>
    </header>

    <!-- 🧩 Los acordeones se generarán dinámicamente aquí -->
    <div class="projects-grid"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
